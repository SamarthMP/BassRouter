name: Production Release

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  PROJECT_FILE: BassRouter.csproj
  PROJECT_NAME: BassRouter
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  TARGET_FRAMEWORK: net10.0

jobs:
  resolve-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read semantic version from project
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content $env:PROJECT_FILE
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Missing <Version> in $env:PROJECT_FILE."
          }

          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Project version '$version' is not valid semantic versioning."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=BassRouter v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-sign-package:
    name: Build, Sign, and Package (${{ matrix.runtime }})
    runs-on: windows-latest
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          dotnet restore $env:PROJECT_FILE --runtime $env:RUNTIME

      - name: Build
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          dotnet build $env:PROJECT_FILE `
            --configuration $env:CONFIGURATION `
            --framework $env:TARGET_FRAMEWORK `
            --runtime $env:RUNTIME `
            -p:Version=$env:VERSION `
            --no-restore

      - name: Decode signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw 'Missing SIGNING_PFX_BASE64 secret.'
          }

          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw 'Missing SIGNING_PASSWORD secret.'
          }

          $rawBase64 = $env:SIGNING_PFX_BASE64.Trim()
          if ($rawBase64.Length -ge 2) {
            $firstChar = $rawBase64[0]
            $lastChar = $rawBase64[$rawBase64.Length - 1]
            if (($firstChar -eq '"' -and $lastChar -eq '"') -or ($firstChar -eq "'" -and $lastChar -eq "'")) {
              $rawBase64 = $rawBase64.Substring(1, $rawBase64.Length - 2)
            }
          }

          $normalizedBase64 = $rawBase64 -replace '\s+', ''
          $invalidCharacters = [regex]::Matches($normalizedBase64, '[^A-Za-z0-9\+/=]') | ForEach-Object { $_.Value } | Select-Object -Unique
          if ($invalidCharacters) {
            $invalidList = ($invalidCharacters | ForEach-Object { "'$_'" }) -join ', '
            throw "SIGNING_PFX_BASE64 contains invalid base64 characters: $invalidList"
          }

          $paddingRemainder = $normalizedBase64.Length % 4
          if ($paddingRemainder -ne 0) {
            $normalizedBase64 = $normalizedBase64.PadRight($normalizedBase64.Length + (4 - $paddingRemainder), '=')
          }

          $certPath = Join-Path $env:RUNNER_TEMP 'signing-cert.pfx'
          try {
            [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($normalizedBase64))
          }
          catch {
            throw "Failed to decode SIGNING_PFX_BASE64 after normalization. Re-save the GitHub secret as the raw base64 of the .pfx file without extra quotes or formatting. $($_.Exception.Message)"
          }

          "SIGNING_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish framework-dependent app
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/$env:RUNTIME"

          dotnet publish $env:PROJECT_FILE `
            --configuration $env:CONFIGURATION `
            --framework $env:TARGET_FRAMEWORK `
            --runtime $env:RUNTIME `
            --self-contained false `
            --no-build `
            -p:Version=$env:VERSION `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir

          "PUBLISH_DIR=$publishDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign executable
        shell: pwsh
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signTool) {
            throw 'signtool.exe was not found on the runner.'
          }

          $exePath = Join-Path $env:PUBLISH_DIR "$env:PROJECT_NAME.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected executable not found: $exePath"
          }

          & $signTool sign /fd SHA256 /f $env:SIGNING_CERT_PATH /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exePath
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }

      - name: Create zip package
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/$env:PROJECT_NAME-$env:RUNTIME-framework-dependent.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $env:PUBLISH_DIR '*') -DestinationPath $zipPath
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        env:
          RUNTIME: ${{ matrix.runtime }}
        with:
          name: published-${{ matrix.runtime }}
          path: artifacts/BassRouter-${{ matrix.runtime }}-framework-dependent.zip
          if-no-files-found: error

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_CERT_PATH -and (Test-Path $env:SIGNING_CERT_PATH)) {
            Remove-Item $env:SIGNING_CERT_PATH -Force
          }

  build-linux-package:
    name: Build and Package (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-x64
          - linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish framework-dependent app
        env:
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          publish_dir="$GITHUB_WORKSPACE/artifacts/publish/$RUNTIME/$PROJECT_NAME"

          dotnet publish "$PROJECT_FILE" \
            --configuration "$CONFIGURATION" \
            --framework "$TARGET_FRAMEWORK" \
            --runtime "$RUNTIME" \
            --self-contained false \
            -p:Version="$VERSION" \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$publish_dir"

          cp Extra/Linux/bassrouter.desktop Extra/Linux/install.sh "$publish_dir/"
          cp Resources/Icon.png "$publish_dir/bassrouter.png"
          chmod +x "$publish_dir/$PROJECT_NAME" "$publish_dir/install.sh"

          echo "PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"

      - name: Create tarball
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          # tar keeps the executable bits, which upload-artifact's zip would drop
          tar -czf "artifacts/$PROJECT_NAME-$RUNTIME-framework-dependent.tar.gz" \
            -C "$(dirname "$PUBLISH_DIR")" "$(basename "$PUBLISH_DIR")"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-${{ matrix.runtime }}
          path: artifacts/BassRouter-${{ matrix.runtime }}-framework-dependent.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - build-sign-package
      - build-linux-package

    steps:
      - name: Verify release tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release tag '$RELEASE_TAG' already exists." >&2
            exit 1
          fi

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: published-*
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          name: ${{ needs.resolve-version.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-artifacts/*.zip
            release-artifacts/*.tar.gz